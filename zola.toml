# The URL the site will be built for
base_url = "https://samuelw3068.netlify.app/"
title = "Samuel's Personal Page"
author = "Samuel Wade Wang"
theme = "radion"
compile_sass = true

# Feeds
generate_feeds = true
taxonomies = [
    { name = "categories", feed = false },
    { name = "tags", feed = false },
]

# build
default_language = "en"
build_search_index = true
generate_sitemap = true
generate_robots_txt = true
minify_html = true

[markdown]
bottom_footnotes = true
external_links_target_blank = true
external_links_external = true
external_links_no_referrer = true
lazy_async_image = true
github_alerts = true
insert_anchor_links = "heading"

[markdown.highlighting]
style = "class"
dark_theme = "everforest-dark"
light_theme = "everforest-dark"
error_on_missing_language = true

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_content = true

[extra]
# Put all your custom variables here
author = "Samuel Wade Wang"
github = "https://github.com/BroccoliTopology"
paginate_by = 5
enable_search = true

# Additional formatting
theme = "toggle" # dark, light, auto, toggle, ...
codeblock = true
latex = true

# Top bar menu
radion_menu = [
    { url = "$BASE_URL", name = "Home" },
    { url = "$BASE_URL/categories", name = "Categories" },
    { url = "$BASE_URL/tags", name = "Tags" },
    # { url = "https://google.com", name = "Google" },
]

# Title of site
radion_title = "Samuel's personal page"

# Disable giscus
comments = false
